apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deception
  namespace: capstone-deception
  labels:
    app: redis-deception
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-deception
  template:
    metadata:
      labels:
        app: redis-deception
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: Never
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis-deception
  namespace: capstone-deception
spec:
  selector:
    app: redis-deception
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
