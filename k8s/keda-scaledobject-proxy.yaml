# KEDA metrics-api scaler example for the proxy Deployment.
# This expects scaling-agent to expose /keda JSON like:
#   {"scale_pressure": 0.0-1.0, "recommended_replicas": 1-10}
# Replace namespace/name/scaleTargetRef to match your Kubernetes manifests.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: honeypot-proxy-scaledobject
  namespace: default
spec:
  scaleTargetRef:
    name: honeypot-proxy
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: metrics-api
      metadata:
        targetValue: "0.60"
        url: "http://scaling-agent.default.svc.cluster.local:8080/keda"
        valueLocation: "scale_pressure"
