services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_USER: postgres
      POSTGRES_DB: testdb
      PGPORT: "5432"
    # ports: intentionally not exposed — only reachable via proxy on 5432
    healthcheck:
      # test: ["CMD-SHELL", "pg_isready -U postgres -p 5432"] this is the original line commented for testing
      # interval: 5s
      # timeout: 5s
      # retries: 10
        test: ["CMD-SHELL", "pg_isready -U postgres -d testdb -h localhost"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 15s

  redpanda:
    image: redpandadata/redpanda:v24.1.9
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
    ports:
      - "127.0.0.1:9092:9092"   # Kafka API: localhost only
      - "127.0.0.1:8082:8082"   # Pandaproxy REST: localhost only
      - "127.0.0.1:9644:9644"   # Admin API: localhost only
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 90s
    volumes:
      - redpandadata:/var/lib/redpanda/data
    networks:
      default:
        aliases:
          - pg-redpanda

  redpanda-init:
    image: redpandadata/redpanda:v24.1.9
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until rpk --brokers redpanda:9092 cluster info >/dev/null 2>&1; do
          echo "waiting for redpanda..."
          sleep 2
        done
        rpk --brokers redpanda:9092 topic create pg-query-events   --partitions 4 --replicas 1 || true
        rpk --brokers redpanda:9092 topic create pg-query-dedup    --partitions 4 --replicas 1 || true
        rpk --brokers redpanda:9092 topic create pg-session-events --partitions 4 --replicas 1 || true
        echo "Topics created."

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5432:5432"   # proxy impersonates PostgreSQL default port
      - "127.0.0.1:9090:9090"   # metrics
    environment:
      PROXY_LISTEN_ADDR: "0.0.0.0:5432"
      PG_BACKEND_ADDR: "postgres:5432"
      HTTP_ADDR: "0.0.0.0:9090"
      LOG_LEVEL: "info"
      SHUTDOWN_TIMEOUT: "30s"
      BACKEND_PING_INTERVAL: "15s"
      MAX_CONNECTIONS: "10000"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_TOPIC: "pg-query-events"
      KAFKA_DEDUP_TOPIC: "pg-query-dedup"
      KAFKA_SESSION_TOPIC: "pg-session-events"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  redpandadata:
