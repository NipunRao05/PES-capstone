services:
  local-llm:
    environment:
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "2"
    volumes:
      - type: bind
        source: "${ORNITH_MODELS_DIR:?set ORNITH_MODELS_DIR to the verified H-drive model directory}"
        target: /root/.ollama
        read_only: true
    mem_limit: 9g
    cpus: 4.0

