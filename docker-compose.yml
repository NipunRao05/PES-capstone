# version: "3.9"

services:

  evidence-store:
    build:
      context: ./evidence_store
    container_name: capstone-evidence-store
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_GROUP_ID: "evidence-store-v1"
      KAFKA_OFFSET_RESET: "latest"
      KAFKA_TOPICS: "mysql-query-events,pg-query-events,mysql-session-events,pg-session-events,session-profiles,mitre-events,mitre-sessions"
      REDIS_HOST: "redis-mitre"
      REDIS_PORT: "6379"
      SCALING_AGENT_URL: "http://scaling-agent:8080"
      POLL_TIMEOUT_SECONDS: "2"
      SCALE_POLL_INTERVAL_SECONDS: "2"
      EVIDENCE_TTL_SECONDS: "2592000"
      MAX_QUERY_EVENTS: "500"
      MAX_STAGE_EVENTS: "100"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8011:8011"
    depends_on:
      redis-mitre:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
      scaling-agent:
        condition: service_started
    networks:
      - default
      - control-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    restart: unless-stopped

  sandbox-replay-engine:
    build:
      context: ./sandbox_replay
    container_name: capstone-sandbox-replay-engine
    environment:
      EVIDENCE_STORE_URL: "http://evidence-store:8011"
      REDIS_HOST: "redis-mitre"
      REDIS_PORT: "6379"
      SANDBOX_POSTGRES_HOST: "sandbox-postgres"
      SANDBOX_POSTGRES_PORT: "5432"
      SANDBOX_POSTGRES_DATABASE: "sandboxdb"
      SANDBOX_POSTGRES_USER: "replay_user"
      SANDBOX_POSTGRES_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
      SANDBOX_POSTGRES_ADMIN_USER: "postgres"
      SANDBOX_POSTGRES_ADMIN_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      SANDBOX_MYSQL_HOST: "sandbox-mysql"
      SANDBOX_MYSQL_PORT: "3306"
      SANDBOX_MYSQL_DATABASE: "sandboxdb"
      SANDBOX_MYSQL_USER: "replay_user"
      SANDBOX_MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
      SANDBOX_MYSQL_ADMIN_USER: "root"
      SANDBOX_MYSQL_ADMIN_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      REPLAY_QUERY_TIMEOUT_MS: "750"
      REPLAY_RESULT_TTL_SECONDS: "604800"
      MAX_QUERIES_PER_REPLAY: "100"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      evidence-store:
        condition: service_started
      redis-mitre:
        condition: service_started
      sandbox-postgres:
        condition: service_healthy
      sandbox-mysql:
        condition: service_healthy
    networks:
      - control-internal
      - sandbox-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    restart: unless-stopped

  sandbox-replay-api:
    image: nginx:1.27-alpine
    container_name: capstone-sandbox-replay-api
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:8012:8012"
    volumes:
      - ./sandbox_replay/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      sandbox-replay-engine:
        condition: service_started
    networks:
      - default
      - control-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    restart: unless-stopped

  sandbox-postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "sandboxdb"
      SANDBOX_REPLAY_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sandbox_replay/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sandboxdb"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - sandbox-internal
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  sandbox-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "sandboxdb"
      MYSQL_USER: "replay_user"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./sandbox_replay/init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - sandbox-internal
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ai-agent:
    build:
      context: ./ai_agent
    container_name: capstone-ai-agent
    environment:
      SCALING_AGENT_URL: http://scaling-agent:8080
      PROMETHEUS_URL: http://prometheus:9090
      METRICS_BRIDGE_URL: http://metrics-bridge:9100
      EVIDENCE_STORE_URL: http://evidence-store:8011
      SANDBOX_REPLAY_URL: http://sandbox-replay-engine:8012
      POLL_TIMEOUT_SECONDS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      - scaling-agent
      - prometheus
      - metrics-bridge
      - evidence-store
      - sandbox-replay-engine
    networks:
      - default
      - control-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    restart: unless-stopped

  llm-agent:
    build:
      context: ./llm_agent
    container_name: capstone-llm-agent
    environment:
      LLM_AGENT_MODE: deterministic_local
      EVIDENCE_STORE_URL: http://evidence-store:8011
      SANDBOX_REPLAY_URL: http://sandbox-replay-engine:8012
      LLM_REQUEST_TIMEOUT_SECONDS: "3"
      LLM_MAX_RESPONSE_BYTES: "1048576"
      LLM_MAX_REPORTS: "500"
      LLM_MAX_TIMELINE_EVENTS: "50"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      evidence-store:
        condition: service_started
      sandbox-replay-engine:
        condition: service_started
    networks:
      - control-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    restart: unless-stopped

  llm-agent-api:
    image: nginx:1.27-alpine
    container_name: capstone-llm-agent-api
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:8013:8013"
    volumes:
      - ./llm_agent/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      llm-agent:
        condition: service_started
    networks:
      - default
      - control-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 20
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.1.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9644:9644"
    expose:
      - "9644"
    volumes:
      - redpandadata:/var/lib/redpanda/data

  redpanda-init:
    image: redpandadata/redpanda:v24.1.9
    depends_on:
      redpanda:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo "Waiting for Redpanda..."
      until rpk cluster info --brokers redpanda:9092 >/dev/null 2>&1; do
        echo "waiting for redpanda..."
        sleep 2
      done

      echo "Creating topics..."

      rpk topic create pg-query-events       --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create pg-query-dedup        --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create pg-session-events     --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create mysql-query-events    --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create mysql-query-dedup     --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create mysql-session-events  --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create session-closed-events --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create session-profiles      --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create mitre-events          --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create mitre-sessions        --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create agent-decisions       --partitions 4 --replicas 1 --brokers redpanda:9092 || true
      rpk topic create dead-letter-events    --partitions 4 --replicas 1 --brokers redpanda:9092 || true

      echo "Topics after init:"
      rpk topic list --brokers redpanda:9092 || true

      echo "All 12 topics created."

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_USER: postgres
      POSTGRES_DB: testdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: testdb
      MYSQL_USER: proxyuser
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysqldata:/var/lib/mysql

  redis-deception:
    image: redis:7-alpine
    volumes:
      - redisdeception:/data

  redis-mitre:
    image: redis:7-alpine
    volumes:
      - redismitre:/data
    networks:
      - default
      - control-internal

  pgproxy:
    build:
      context: ./pgproxy
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PGPROXY_HOST_PORT:-5432}:5432"
      - "127.0.0.1:9090:9090"
    environment:
      PROXY_LISTEN_ADDR: "0.0.0.0:5432"
      PG_BACKEND_ADDR: "postgres:5432"
      HTTP_ADDR: "0.0.0.0:9090"
      LOG_LEVEL: "info"
      SHUTDOWN_TIMEOUT: "30s"
      BACKEND_PING_INTERVAL: "15s"
      MAX_CONNECTIONS: "10000"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_TOPIC: "pg-query-events"
      KAFKA_DEDUP_TOPIC: "pg-query-dedup"
      KAFKA_SESSION_TOPIC: "pg-session-events"
      DECEPTION_ENGINE_URL: "http://deception-engine:8001/decide"
    depends_on:
      postgres:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mysqlproxy:
    build:
      context: ./mysqlproxy
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${MYSQLPROXY_HOST_PORT:-3306}:3306"
      - "127.0.0.1:9091:9091"
    environment:
      PROXY_LISTEN_ADDR: "0.0.0.0:3306"
      MYSQL_BACKEND_ADDR: "mysql:3306"
      HTTP_ADDR: "0.0.0.0:9091"
      LOG_LEVEL: "info"
      SHUTDOWN_TIMEOUT: "30s"
      BACKEND_PING_INTERVAL: "15s"
      MAX_CONNECTIONS: "10000"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_TOPIC: "mysql-query-events"
      KAFKA_DEDUP_TOPIC: "mysql-query-dedup"
      KAFKA_SESSION_TOPIC: "mysql-session-events"
      DECEPTION_ENGINE_URL: "http://deception-engine:8001/decide"
    depends_on:
      mysql:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  session-module:
    build:
      context: ./session_module
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8003:8003"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      OWN_REDPANDA_BOOTSTRAP: "redpanda:9092"
      MYSQL_REDPANDA_BOOTSTRAP: "redpanda:9092"
      PG_REDPANDA_BOOTSTRAP: "redpanda:9092"
      TOPIC_MYSQL_INPUT: "mysql-query-events"
      TOPIC_PG_INPUT: "pg-query-events"
      TOPIC_MYSQL_SESSION: "mysql-session-events"
      TOPIC_PG_SESSION: "pg-session-events"
      TOPIC_MITRE_EVENTS: "mitre-events"
      TOPIC_SESSION_CLOSED: "session-closed-events"
      TOPIC_SESSION_PROFILES: "session-profiles"
      CONSUMER_GROUP: "session-module-group"
      CONSUMER_AUTO_OFFSET_RESET: "${CONSUMER_AUTO_OFFSET_RESET:-latest}"
      METRICS_PORT: "8000"
      STATE_API_HOST: "0.0.0.0"
      STATE_API_PORT: "8003"
      STATE_MAX_SESSIONS: "5000"
      PYTHONUNBUFFERED: "1"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  deception-engine:
    build:
      context: ./deception_engine
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      REDIS_HOST: "redis-deception"
      REDIS_PORT: "6379"
      KAFKA_BROKERS: "redpanda:9092"
      PORT: "8001"
      DECEPTION_HOSTNAME: "db-prod-02"
      DECEPTION_DATADIR: "/var/lib/mysql"
      DECEPTION_VERSION_COMMENT: "MySQL Community Server - GPL"
      DECEPTION_VERSION: "8.0.34-log"
      DECEPTION_PORT: "3306"
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis-deception:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mitre-agent:
    build:
      context: ./mitre_agent
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      MYSQL_KAFKA_BROKERS: "redpanda:9092"
      PG_KAFKA_BROKERS: "redpanda:9092"
      MITRE_KAFKA_BROKERS: "redpanda:9092"
      SESSION_KAFKA_BROKERS: "redpanda:9092"
      REDIS_HOST: "redis-mitre"
      REDIS_PORT: "6379"
      TOPIC_MYSQL_QUERIES: "mysql-query-events"
      TOPIC_PG_QUERIES: "pg-query-events"
      TOPIC_MYSQL_SESSION: "mysql-session-events"
      TOPIC_PG_SESSION: "pg-session-events"
      TOPIC_SESSION_PROFILES: "session-profiles"
      TOPIC_MITRE_EVENTS: "mitre-events"
      TOPIC_MITRE_SESSIONS: "mitre-sessions"
      PYTHONUNBUFFERED: "1"
      CONSUMER_AUTO_OFFSET_RESET: "${CONSUMER_AUTO_OFFSET_RESET:-latest}"
      HEALTH_ADDR: "0.0.0.0:8002"
    depends_on:
      redis-mitre:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  scaling-agent:
    build:
      context: ./scaling_agent
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9095:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      TOPIC_MITRE_EVENTS: "mitre-events"
      TOPIC_SESSION_PROFILES: "session-profiles"
      CONSUMER_GROUP: "scaling-agent"
      HTTP_ADDR: "0.0.0.0:8080"
      LOG_LEVEL: "info"
      DIAL_TIMEOUT: "10s"
      CONSUMER_START_OFFSET: "${CONSUMER_START_OFFSET:-latest}"
      STATE_REDIS_ADDR: "redis-mitre:6379"
      STATE_REDIS_DB: "0"
      STATE_REDIS_KEY: "capstone:scaling-agent:state:v1"
      STATE_REDIS_TIMEOUT: "1s"
      STATE_PERSISTENCE_REQUIRED: "true"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      redis-mitre:
        condition: service_started
    restart: unless-stopped

  metrics-bridge:
    build:
      context: ./observability/metrics_bridge
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9100:9100"
    environment:
      PGPROXY_METRICS_URL: "http://pgproxy:9090/metrics"
      MYSQLPROXY_METRICS_URL: "http://mysqlproxy:9091/metrics"
      DECEPTION_ENGINE_METRICS_URL: "http://deception-engine:8001/metrics"
      MITRE_AGENT_METRICS_URL: "http://mitre-agent:8002/metrics"
      SESSION_MODULE_METRICS_URL: "http://session-module:8000/metrics"
      REDPANDA_METRICS_URL: "http://redpanda:9644/metrics"
      SCALING_METRICS_URL: "http://scaling-agent:8080/metrics"
      SCALING_RAW_URL: "http://scaling-agent:8080/metrics/raw"
      SCALING_EVENTS_URL: "http://scaling-agent:8080/scale/events"
      SCRAPE_TIMEOUT: "1.0"
      REDIS_HOST: "redis-mitre"
      REDIS_PORT: "6379"
      PORT: "9100"
      PYTHONUNBUFFERED: "1"
    depends_on:
      pgproxy:
        condition: service_started
      mysqlproxy:
        condition: service_started
      deception-engine:
        condition: service_started
      mitre-agent:
        condition: service_started
      session-module:
        condition: service_started
      scaling-agent:
        condition: service_started
      redpanda:
        condition: service_started
      redis-mitre:
        condition: service_started
    restart: unless-stopped

  json-exporter:
    image: quay.io/prometheuscommunity/json-exporter:v0.7.0
    command:
      - --config.file=/config.yml
    volumes:
      - ./observability/json_exporter.yml:/config.yml:ro
    networks:
      - default
      - control-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "127.0.0.1:9096:9090"
    volumes:
      - ./observability:/etc/prometheus/config:ro
      - prometheusdata:/prometheus
    command:
      - --config.file=/etc/prometheus/config/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    depends_on:
      - metrics-bridge
      - json-exporter
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki:/etc/loki
      - lokidata:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_SERVER_DOMAIN: "localhost"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "disabled"
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: "localhost:3000,127.0.0.1:3000"
      GF_SECURITY_CSRF_ALWAYS_CHECK: "false"
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/live_attack_feed.json"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  pgdata:
  mysqldata:
  redpandadata:
  redisdeception:
  redismitre:
  prometheusdata:
  lokidata:
  grafanadata:

networks:
  default:
  control-internal:
    internal: true
  sandbox-internal:
    internal: true
