    name: BASELINE
    description: Existing deterministic protocol, banner, passthrough, and safe fallback behavior.
    supported_protocols: [mysql, postgres]
    required_state: [session_id, protocol]
    forbidden_state: []
    activation_conditions: [no more-specific mapped behavior applies, requested strategy is missing or not approved]
    compatible_personas: [unknown, low_activity, script, automated_tool, human_attacker, brute_bot]
    schema_assets: []
    trap_assets: []
    risk_level: low
    resource_cost: low
    validation_version: phase3-v1
