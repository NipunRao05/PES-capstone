# Temporary pinned collector exception; static files require no Docker API/socket.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker-json-files
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            docker_time: time
            service: 'attrs."com.docker.compose.service"'
            compose_project: 'attrs."com.docker.compose.project"'
            environment: 'attrs."honeypot.environment"'
      - labels:
          service:
          compose_project:
          environment:
      - match:
          selector: '{compose_project!="capstone-main"}'
          action: drop
      - match:
          selector: '{service=~"pgproxy|mysqlproxy|scaling-agent|deception-engine|session-module|evidence-store|sandbox-replay-engine"}'
          stages:
            - json:
                source: output
                expressions:
                  level: level
      - match:
          selector: '{service=~"postgres|sandbox-postgres"}'
          stages:
            - regex:
                source: output
                expression: '^\d{4}-\d{2}-\d{2} [0-9:.]+ [A-Z]+ \[\d+\] (?P<level>LOG|ERROR|WARNING|FATAL|PANIC|INFO|NOTICE|DEBUG):'
      - match:
          selector: '{service=~"mysql|sandbox-mysql"}'
          stages:
            - regex:
                source: output
                expression: '^\d{4}-\d{2}-\d{2}T[0-9:.]+Z \d+ \[(?P<level>System|Note|Warning|ERROR)\] \[MY-\d+\]'
      - match:
          selector: '{service="redpanda"}'
          stages:
            - regex:
                source: output
                expression: '^(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s+\d{4}-\d{2}-\d{2}'
      - match:
          selector: '{service=~"redis-deception|redis-mitre"}'
          stages:
            - regex:
                source: output
                expression: '^\d+:[A-Z] \d{2} [A-Za-z]{3} \d{4} [0-9:.]+ (?P<level>[*#.\-]) '
      - template:
          source: level
          template: '{{ $v := ToLower .Value }}{{ if or (eq $v "info") (eq $v "log") (eq $v "notice") (eq $v "system") (eq $v "note") (eq $v "*") }}info{{ else if or (eq $v "warn") (eq $v "warning") (eq $v "#") }}warning{{ else if eq $v "error" }}error{{ else if or (eq $v "critical") (eq $v "fatal") (eq $v "panic") }}critical{{ else if or (eq $v "debug") (eq $v "trace") (eq $v ".") (eq $v "-") }}debug{{ else }}unknown{{ end }}'
      - labels:
          level:
      - timestamp:
          source: docker_time
          format: RFC3339Nano
      - output:
          source: output
      - labeldrop: [filename]
