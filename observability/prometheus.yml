global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/config/capstone_alert_rules.yml

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "metrics-bridge"
    static_configs:
      - targets: ["metrics-bridge:9100"]

  - job_name: "redpanda"
    static_configs:
      - targets: ["redpanda:9644"]
